<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edece8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)">
  <title>WarsawNow – co robić w Warszawie dziś</title>
  <meta name="description" content="Propozycje na wolny czas w Warszawie dopasowane do Ciebie i Twojej okolicy.">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <!-- PWA: manifest i ikony z UI mockups request (1)/assets/logo.jpg (sips) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="WarsawNow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Anybody (nagłówki-plakaty, oś szerokości) + Familjen Grotesk (tekst) -->
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Familjen+Grotesk:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block" rel="stylesheet">
  <script>
    // Motyw przed pierwszym renderem (bez mignięcia jasnego tła): klasa .dark na <html>, jak w lib/theme.ts
    try {
      var t = localStorage.getItem("warsawnow-theme");
      var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    } catch (e) {}
  </script>
  <!-- Konfiguracja runtime (Terraform / scripts/frontend-dev.sh), nie jest bundlowana -->
  <script src="/config.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
