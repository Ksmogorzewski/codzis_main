# Konfiguracja narzędzi deweloperskich backendu (pytest, ruff, mypy).
# Zależności: requirements-dev.txt. Uruchomienie wszystkiego: scripts/backend-check.sh

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warstwa codzis_common (w Lambdzie: /opt/python)
pythonpath = ["src/layers/common/python"]
addopts = "-ra"

# Lint i formatowanie: na razie tylko Lambdy API (klient, partner, dispatcher), wspólna warstwa, zdjęcia taggera
# (tagger/images.py) i testy. recommender/ (z testami w tests/recommender/), reszta tagger/, src/importer/,
# src/recommender_api/ - do objęcia w przyszłości.
[tool.ruff]
target-version = "py313"
line-length = 120
include = [
    "src/client_api/**/*.py",
    "src/api/**/*.py",
    "src/dispatcher/**/*.py",
    "src/layers/**/*.py",
    "tagger/images.py",
    "tests/**/*.py",
]
extend-exclude = ["tests/recommender"]

[tool.ruff.lint]
# pyflakes, pycodestyle (błędy + ostrzeżenia), isort, bugbear, pyupgrade
select = ["F", "E", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Moduły Lambd importowane jak w runtime (katalog Lambdy w sys.path)
# routes/ (routery Powertools per domena) i schemas (modele Pydantic) - client-api i API partnera.
known-first-party = [
    "account", "crews", "onboarding", "handler", "config", "events", "friends", "payments", "profiles", "store",
    "routes", "schemas", "codzis_common", "tests",
]

[tool.ruff.format]
# Ręcznie ułożona tabela pytań ankiety jest czytelniejsza niż po automatycznym formatowaniu (lint nadal działa).
exclude = ["src/client_api/onboarding.py"]

# mypy uruchamiamy osobno dla każdej Lambdy (każda ma własny moduł `handler`) - patrz scripts/backend-check.sh.
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true  # boto3/moto bez pakietów stubów
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
mypy_path = "src/layers/common/python"
exclude = ["^tests/recommender/"]  # jak recommender/ w ruff (wyżej)

# tests/tagger/ importuje tagger.images, a z nim pakiet tagger: reszta taggera jeszcze bez typów (jak w ruff wyżej),
# więc błędy tylko z tagger/images.py (konkretny moduł ma pierwszeństwo przed wzorcem).
[[tool.mypy.overrides]]
module = ["tagger", "tagger.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "tagger.images"
ignore_errors = false
